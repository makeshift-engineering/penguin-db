version: v2

plugins:
  # protoc-gen-go: generates message types and serialization code
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: ../gen/go
    opt:
      - module=github.com/makeshift-engineering/penguin-db/gen/go

  # protoc-gen-go-grpc: generates gRPC service stubs and interfaces
  - remote: buf.build/grpc/go:v1.6.2
    out: ../gen/go
    opt:
      - module=github.com/makeshift-engineering/penguin-db/gen/go
