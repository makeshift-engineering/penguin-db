name: Go Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -count=1 ./... 2>&1 | tee test_output.txt

      - name: List failed tests
        if: failure()
        run: |
          echo "========================================="
          echo "           FAILED TEST CASES             "
          echo "========================================="
          if [ -f test_output.txt ]; then
            grep -E "--- FAIL:" test_output.txt || echo "No failed tests found in output (check compilation or panic errors)."
          else
            echo "test_output.txt not found."
          fi
          echo "========================================="
